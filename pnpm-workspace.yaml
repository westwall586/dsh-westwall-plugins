packages:
  - "packages/*"

# pnpm 11 起，非认证类设置放这里（.npmrc 只留给 registry/auth）。
# 本地 workspace 包按版本匹配时走 link：改 packages/x 立即生效。
linkWorkspacePackages: true
# engines 不满足时直接失败，而不是只打 WARN。
engineStrict: true
# 宿主服务由 DSH 提供，不从 registry 拉取（否则会装上整个 @deepseek-ai/dsh 依赖树）。
autoInstallPeers: false
allowBuilds:
  # feed-ultra 用 esbuild 打浏览器半体（client.js）。
  esbuild: true
  # 宿主侧原生/大依赖的安装脚本：插件库只在构建时需要它们的类型，
  # 不需要运行它们的 postinstall（也不下载预编译二进制）。
  '@deepseek-ai/dsh-subprocess-local': false
  '@google/genai': false
  koffi: false
  node-pty: false
  protobufjs: false
minimumReleaseAgeExclude:
  - '@deepseek-ai/dsh-client-ui-primitives@0.2.2-rc.5'
