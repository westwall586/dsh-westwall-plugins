<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>设置 · 友好表达</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body { margin: 0; }
button { font-family: inherit; }
</style>
</helmet>
<div style="width: 1280px; height: 820px; box-sizing: border-box; background: #0A0C10; color: #E9EDF5; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', 'Microsoft YaHei', sans-serif; display: flex; overflow: hidden; -webkit-font-smoothing: antialiased;">

  <aside style="width: 250px; flex: none; box-sizing: border-box; padding: 26px 14px; background: #0C0F14; border-right: 1px solid #1D232E; display: flex; flex-direction: column; gap: 3px;">
    <div style="padding: 0 10px 18px; font-size: 24px; font-weight: 650; letter-spacing: .2px;">设置</div>

    <button style="display: flex; align-items: center; gap: 10px; width: 100%; height: 42px; padding: 0 12px; border: 0; border-radius: 10px; background: transparent; color: #A7B0BE; font: inherit; font-size: 13.5px; text-align: left;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c.6-3.6 3.4-5.6 7-5.6s6.4 2 7 5.6"/></svg>
      账号与余额
    </button>

    <button style="display: flex; align-items: center; gap: 10px; width: 100%; height: 42px; padding: 0 12px; border: 0; border-radius: 10px; background: transparent; color: #A7B0BE; font: inherit; font-size: 13.5px; text-align: left;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2.4"/><circle cx="15" cy="17" r="2.4"/></svg>
      通用设置
    </button>

    <button style="display: flex; align-items: center; gap: 10px; width: 100%; height: 42px; padding: 0 12px; border: 0; border-radius: 10px; background: transparent; color: #A7B0BE; font: inherit; font-size: 13.5px; text-align: left;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6"/><path d="M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/></svg>
      模型
    </button>

    <button style="display: flex; align-items: center; gap: 10px; width: 100%; height: 42px; padding: 0 12px; border: 0; border-radius: 10px; background: transparent; color: #A7B0BE; font: inherit; font-size: 13.5px; text-align: left;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg>
      内置插件
    </button>

    <button aria-current="page" style="display: flex; align-items: center; gap: 10px; width: 100%; height: 42px; padding: 0 12px; border: 0; border-radius: 10px; background: #1A2029; color: #F4F7FD; font: inherit; font-size: 13.5px; font-weight: 550; text-align: left;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" style="color: #A9C4FF;" aria-hidden="true" focusable="false"><path d="M5 5.5h14A1.5 1.5 0 0 1 20.5 7v7a1.5 1.5 0 0 1-1.5 1.5h-9l-4.8 3.4a.6.6 0 0 1-.9-.5V6.5A1.5 1.5 0 0 1 5 5.5Z"/><circle cx="9" cy="10.8" r=".9" fill="currentColor" stroke="none"/><circle cx="12" cy="10.8" r=".9" fill="currentColor" stroke="none"/><circle cx="15" cy="10.8" r=".9" fill="currentColor" stroke="none"/></svg>
      友好表达
    </button>

    <button style="display: flex; align-items: center; gap: 10px; width: 100%; height: 42px; padding: 0 12px; border: 0; border-radius: 10px; background: transparent; color: #A7B0BE; font: inherit; font-size: 13.5px; text-align: left;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 4a8 8 0 1 0 0 16h1.4a1.8 1.8 0 0 0 1.3-3.1 1.8 1.8 0 0 1 1.3-3.1H18a2 2 0 0 0 2-2A8 8 0 0 0 12 4Z"/><circle cx="8.2" cy="10" r="1" fill="currentColor" stroke="none"/><circle cx="11" cy="7.4" r="1" fill="currentColor" stroke="none"/><circle cx="15.2" cy="8.4" r="1" fill="currentColor" stroke="none"/></svg>
      OpenCode 调色板
    </button>

    <button style="display: flex; align-items: center; gap: 10px; width: 100%; height: 42px; padding: 0 12px; border: 0; border-radius: 10px; background: transparent; color: #A7B0BE; font: inherit; font-size: 13.5px; text-align: left;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="9" cy="8" r="3"/><path d="M3.5 19c.5-3 2.8-4.7 5.5-4.7s5 1.7 5.5 4.7"/><path d="M15.5 5.6a3 3 0 0 1 0 5.8"/><path d="M17.5 14.6c2 .5 3.3 2 3.7 4.4"/></svg>
      Agent 预设
    </button>

    <button style="display: flex; align-items: center; gap: 10px; width: 100%; height: 42px; padding: 0 12px; border: 0; border-radius: 10px; background: transparent; color: #A7B0BE; font: inherit; font-size: 13.5px; text-align: left;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="5" y="8" width="14" height="10" rx="3"/><path d="M12 8V5"/><circle cx="12" cy="4" r="1"/><circle cx="9.5" cy="13" r=".9" fill="currentColor" stroke="none"/><circle cx="14.5" cy="13" r=".9" fill="currentColor" stroke="none"/></svg>
      IM 机器人
    </button>

    <button style="display: flex; align-items: center; gap: 10px; width: 100%; height: 42px; padding: 0 12px; border: 0; border-radius: 10px; background: transparent; color: #A7B0BE; font: inherit; font-size: 13.5px; text-align: left;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6 8h12l-1 11H7L6 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
      插件市场
    </button>
  </aside>

  <main style="position: relative; flex: 1; min-width: 0; box-sizing: border-box; padding: 46px 52px;">
    <button aria-label="关闭设置" style="position: absolute; right: 36px; top: 34px; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 8px; background: transparent; color: #8B95A7;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>

    <div style="font-size: 27px; font-weight: 650; letter-spacing: .2px;">友好表达</div>
    <div style="margin-top: 8px; font-size: 14px; line-height: 1.6; color: #98A2B3;">让 Agent 说得清楚，也画得明白。</div>

    <section style="margin-top: 28px; box-sizing: border-box; padding: 22px 24px 20px; background: #11151C; border: 1px solid #232B38; border-radius: 14px;">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 16px;">
        <div style="font-size: 15.5px; font-weight: 600;">表达方式</div>
        <div style="font-size: 12px; color: #7A8494;">保存后对新会话生效</div>
      </div>
      <div style="margin-top: 6px; font-size: 13px; line-height: 1.6; color: #8B95A7;">这段文字会随每个请求进入系统提示词，约束措辞、结构与语气。</div>

      <div style="margin-top: 14px; height: 286px; box-sizing: border-box; padding: 16px 18px; background: #0B0F15; border: 1px solid #263041; border-radius: 10px; font-size: 13.5px; line-height: 1.75; color: #D6DEEB; white-space: pre-wrap; overflow: hidden;">紧扣问题，先给结论，再给必要依据。不确定的地方明确标注，不编造。只讲相关信息，不复述已知内容。长内容分点，按重要性排序；语气自然直接，不堆客套。禁止使用 ASCII 方框和箭头画图；默认用 Mermaid 11.x表达，简单内容不强行画图。对比用表格，线性步骤用有序列表，文件树保留缩进。用户明确要求其他形式时，以用户要求为准。</div>

      <div style="margin-top: 14px; display: flex; align-items: center; justify-content: space-between;">
        <div style="font-size: 12px; color: #7A8494;">164 / 800</div>
        <div style="display: flex; gap: 10px;">
          <button style="height: 36px; padding: 0 14px; border: 1px solid #2B3444; border-radius: 8px; background: transparent; color: #D6DEEB; font: inherit; font-size: 13px;">恢复默认</button>
          <button style="height: 36px; padding: 0 18px; border: 0; border-radius: 8px; background: #2F6BFF; color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 600;">保存</button>
        </div>
      </div>
      <div style="margin-top: 10px; font-size: 12px; color: #6F7A8B;">恢复默认会回到系统推荐文案；已有会话保持原提示词。</div>
    </section>

    </main>
</div>
</x-dc>

  renderVals() {
    return {};
  }

</script>
</body>
</html>
