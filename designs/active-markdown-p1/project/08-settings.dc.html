<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>08 插件页设置</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;-webkit-font-smoothing:antialiased;background:#f9fafb}
.pane{width:880px;height:620px;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;background:#f9fafb;color:#0f1115;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;font-size:13px}
.crumb{flex:none;display:flex;align-items:center;gap:6px;height:38px;padding:0 16px;background:#f9fafb;border-bottom:.5px solid rgba(0,0,0,.08);font-size:12.5px;color:#81858c}
.crumb b{font-weight:600;color:#0f1115}
.body{flex:1 1 auto;min-height:0;overflow:hidden;padding:20px 18px}
.head{display:flex;align-items:flex-start;gap:12px;margin:0 0 16px;padding:0 2px}
.head .title{flex:1 1 auto;min-width:0}
.head h1{margin:0 0 4px;font-size:17px;line-height:1.4;font-weight:600}
.head p{margin:0;font-size:12.5px;line-height:1.6;color:#81858c}
.card{border:.5px solid rgba(0,0,0,.1);border-radius:12px;background:#fff;overflow:hidden}
.card h2{margin:0;padding:12px 16px 0;font-size:13px;line-height:1.5;font-weight:600}
.card .lede{margin:0;padding:3px 16px 12px;font-size:12px;line-height:1.6;color:#81858c;border-bottom:.5px solid rgba(0,0,0,.06)}
.row{display:flex;align-items:flex-start;gap:16px;padding:14px 16px;border-bottom:.5px solid rgba(0,0,0,.06)}
.row:last-child{border-bottom:0}
.row .k{flex:none;width:150px;padding-top:5px}
.row .k .n{font-size:13px;line-height:1.5}
.row .k .d{margin-top:2px;font-size:11.5px;line-height:1.5;color:#81858c}
.row .v{flex:1 1 auto;min-width:0;max-width:390px}
.val{display:flex;align-items:center;gap:8px;height:32px;box-sizing:border-box;padding:0 10px;border:.5px solid rgba(0,0,0,.14);border-radius:8px;background:#fff;font-size:12.5px}
.val span{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.val em{font-style:normal;color:#81858c;font-family:'SF Mono',Menlo,monospace;font-size:11.5px}
.sw{position:relative;flex:none;width:34px;height:20px;border-radius:10px;background:#4176e6}
.sw::after{content:'';position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.foot{padding:11px 16px;font-size:11.5px;line-height:1.6;color:#81858c;background:#f9fafb;border-top:.5px solid rgba(0,0,0,.06)}
</style>
</helmet>
<div class="pane">
  <div class="crumb"><span>设置</span><span>/</span><span>插件</span><span>/</span><b>可交互 Markdown</b></div>

  <div class="body">
    <div class="head">
      <div class="title">
        <h1>翻译</h1>
        <p>这几项只影响本插件发起的翻译，不会改动会话正在使用的模型。</p>
      </div>
    </div>

    <div class="card">
      <h2>翻译设置</h2>
      <p class="lede">设置会保存到本机 profile，换会话不丢。</p>

      <div class="row">
        <div class="k">
          <div class="n">翻译模型</div>
          <div class="d">留空则跟随会话默认模型</div>
        </div>
        <div class="v">
          <div class="val"><span>deepseek-v4-flash</span>
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#61666b" stroke-width="1.4" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5"/></svg>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="k">
          <div class="n">目标语言</div>
          <div class="d">会拼进翻译提示词</div>
        </div>
        <div class="v">
          <div class="val"><span>简体中文</span>
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#61666b" stroke-width="1.4" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5"/></svg>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="k">
          <div class="n">代码注释</div>
          <div class="d">代码本身始终逐字保留</div>
        </div>
        <div class="v" style="display:flex;align-items:center;height:32px">
          <span class="sw" role="img" aria-label="已开启"></span>
        </div>
      </div>

      <div class="foot">修改立即生效；已经生成的译文不受影响，重新翻译时按新设置执行。</div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":880,"height":620}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
