name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 聚合清单与包集合一致
        run: pnpm aggregate:check

      - name: 构建
        run: pnpm -r build

      - name: 构建产物必须与源码一致（lib 入库）
        run: git diff --exit-code -- packages

      - name: 类型检查
        run: pnpm -r typecheck

      - name: 单元测试
        run: pnpm -r --if-present test
