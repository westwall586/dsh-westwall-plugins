name: release

on:
  push:
    tags:
      - 'dsh-*@*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag，形如 dsh-hello@0.1.0'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: 校验 tag 与该包版本、聚合清单一致
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: node scripts/release.mjs --tag "$TAG"

      - name: 构建
        run: pnpm -r build

      - name: 发布到 npm
        if: vars.PUBLISH_ENABLED == 'true'
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: node scripts/release.mjs --tag "$TAG" --publish

      - name: 未开启发布时的提示
        if: vars.PUBLISH_ENABLED != 'true'
        run: |
          echo "::notice::PUBLISH_ENABLED 未开启，本次只做校验。"
          echo "在仓库 Settings → Secrets and variables → Actions → Variables 中设置 PUBLISH_ENABLED=true 后才会真正发布。"
